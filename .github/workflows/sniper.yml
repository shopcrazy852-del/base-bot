name: Base MEV 24-7 Continuous Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mev-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Master Quant Engine
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          pip install requests eth-account eth-utils eth-abi
          python -u bot.py
